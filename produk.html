<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Produk - Brew & Crumb</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <aside class="sidebar">
    <div>
      <div class="brand">
        <div class="logo-box">BC</div>
        <div><strong>Brew & Crumb</strong><br><small style="color:#d6ccc2;">Coffee & Bakery</small></div>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Kasir</a></li>
        <li><a href="produk.html" class="active">Produk</a></li>
        <li><a href="transaksi.html">Transaksi</a></li>
        <li><a href="ringkasan.html">Ringkasan</a></li>
      </ul>
    </div>
    <div class="sidebar-bottom"><a href="pengaturan.html">Pengaturan</a></div>
  </aside>

  <main class="main-content">
    <h1>Manajemen Produk</h1>
    <div class="grid-2">
      <div class="card">
        <h3>Daftar Menu Tersedia</h3>
        <table>
          <thead><tr><th>Nama Menu</th><th>Kategori</th><th>Harga</th><th>Aksi</th></tr></thead>
          <tbody>
            <tr><td>Caramel Macchiato</td><td>Coffee</td><td>Rp 28.000</td><td><button class="btn btn-secondary">Edit</button></td></tr>
            <tr><td>Americano Iced</td><td>Coffee</td><td>Rp 20.000</td><td><button class="btn btn-secondary">Edit</button></td></tr>
            <tr><td>Butter Croissant</td><td>Pastry</td><td>Rp 22.000</td><td><button class="btn btn-secondary">Edit</button></td></tr>
          </tbody>
        </table>
      </div>
      <div class="card">
        <h3>Tambah / Edit Produk</h3><br>
        <div class="form-group"><label>Nama Produk</label><input type="text" placeholder="Contoh: Matcha Latte"></div>
        <div class="form-group"><label>Kategori</label><select><option>Coffee</option><option>Non-Coffee</option><option>Pastry</option></select></div>
        <div class="form-group"><label>Harga (Rp)</label><input type="number" placeholder="25000"></div>
        <button class="btn" onclick="simpanProduk()">Simpan Produk</button>
      </div>
    </div>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
